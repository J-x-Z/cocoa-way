name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: brew install libxkbcommon pkg-config

      - name: Verify release version
        run: |
          PACKAGE_VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(next(package["version"] for package in json.load(sys.stdin)["packages"] if package["name"] == "cocoa-way"))')
          test "${GITHUB_REF_NAME}" = "v${PACKAGE_VERSION}"

      - name: Verify vendored sources
        run: python3 scripts/vendor-smithay.py

      - name: Build for arm64
        run: cargo build --release --bins --locked

      - name: Create .app Bundle
        run: |
          APP_NAME="Cocoa-Way"
          APP_DIR="${APP_NAME}.app"
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p "${APP_DIR}/Contents/MacOS"
          mkdir -p "${APP_DIR}/Contents/Frameworks"
          mkdir -p "${APP_DIR}/Contents/Resources"
          
          cp target/release/cocoa-way "${APP_DIR}/Contents/MacOS/"
          cp target/release/cocoa-wayctl "${APP_DIR}/Contents/MacOS/"
          cp target/release/cocoa-way-mcp "${APP_DIR}/Contents/MacOS/"
          cp assets/icon.png "${APP_DIR}/Contents/Resources/AppIcon.png"
          
          cat > "${APP_DIR}/Contents/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>cocoa-way</string>
              <key>CFBundleIdentifier</key>
              <string>com.jxz.cocoa-way</string>
              <key>CFBundleName</key>
              <string>Cocoa-Way</string>
              <key>CFBundleDisplayName</key>
              <string>Cocoa-Way</string>
              <key>CFBundleVersion</key>
              <string>VERSION_PLACEHOLDER</string>
              <key>CFBundleShortVersionString</key>
              <string>VERSION_PLACEHOLDER</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>LSApplicationCategoryType</key>
              <string>public.app-category.developer-tools</string>
          </dict>
          </plist>
          PLIST
          sed -i '' "s/VERSION_PLACEHOLDER/${VERSION}/g" "${APP_DIR}/Contents/Info.plist"

      - name: Bundle example image resources
        run: bash scripts/bundle-example-resources.sh Cocoa-Way.app/Contents/Resources/container-images

      - name: Bundle runtime dylibs
        run: |
          chmod +x ./scripts/bundle-macos-app.sh
          ./scripts/bundle-macos-app.sh Cocoa-Way.app

      - name: Verify bundled dylibs
        run: |
          bash scripts/bundle-example-resources.sh --check Cocoa-Way.app/Contents/Resources/container-images
          test -f Cocoa-Way.app/Contents/Resources/xkb/rules/evdev
          test -f Cocoa-Way.app/Contents/Resources/xkb/keycodes/evdev
          test -f Cocoa-Way.app/Contents/Resources/xkb/symbols/us
          for executable in cocoa-way cocoa-wayctl cocoa-way-mcp; do
            ! otool -L "Cocoa-Way.app/Contents/MacOS/${executable}" | grep -E '/(opt/homebrew|usr/local|nix)/'
            ! otool -L "Cocoa-Way.app/Contents/MacOS/${executable}" | grep -i pixman
          done
          codesign --verify --deep --strict --verbose=2 Cocoa-Way.app
          Cocoa-Way.app/Contents/MacOS/cocoa-wayctl --help >/dev/null
          Cocoa-Way.app/Contents/MacOS/cocoa-way-mcp </dev/null

      - name: Create ZIP archive
        run: |
          zip -r "Cocoa-Way-${{ github.ref_name }}-arm64-macos.zip" Cocoa-Way.app

      - name: Create DMG
        run: |
          hdiutil create -volname "Cocoa-Way" -srcfolder Cocoa-Way.app -ov -format UDZO "Cocoa-Way-${{ github.ref_name }}-arm64-macos.dmg"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Cocoa-Way-${{ github.ref_name }}-arm64-macos.zip
            Cocoa-Way-${{ github.ref_name }}-arm64-macos.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate SHA256
        id: sha
        run: |
          SHA=$(shasum -a 256 "Cocoa-Way-${{ github.ref_name }}-arm64-macos.zip" | cut -d ' ' -f 1)
          echo "sha256=$SHA" >> $GITHUB_OUTPUT
          echo "SHA256: $SHA"

    outputs:
      sha256: ${{ steps.sha.outputs.sha256 }}
