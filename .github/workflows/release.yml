name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable action, verified 2026-10-15
        with:
          toolchain: stable

      - name: Install dependencies
        run: brew install libxkbcommon pkg-config

      - name: Verify release version and architecture
        run: |
          test "$(uname -m)" = arm64
          PACKAGE_VERSION=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json, sys; print(next(package["version"] for package in json.load(sys.stdin)["packages"] if package["name"] == "cocoa-way"))')
          test "${GITHUB_REF_NAME}" = "v${PACKAGE_VERSION}"

      - name: Test supply-chain guards
        run: python3 scripts/test-supplychain.py

      - name: Install pinned advisory scanner
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Check current advisories, locked macOS graphs, vendor and provenance
        run: python3 scripts/check-supplychain.py --verify-upstreams

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Build for arm64
        run: cargo build --release --bins --locked

      - name: Create and verify app with the CI-tested bundling path
        run: python3 scripts/supplychain-bundle.py Cocoa-Way.app --version "${GITHUB_REF_NAME#v}" --arch arm64

      - name: Ensure validation did not mutate dependency inputs
        run: git diff --exit-code -- Cargo.toml Cargo.lock test-client/Cargo.toml vendor Formula

      - name: Create ZIP archive
        run: zip -r "Cocoa-Way-${GITHUB_REF_NAME}-arm64-macos.zip" Cocoa-Way.app

      - name: Create DMG
        run: hdiutil create -volname "Cocoa-Way" -srcfolder Cocoa-Way.app -ov -format UDZO "Cocoa-Way-${GITHUB_REF_NAME}-arm64-macos.dmg"

      - name: Calculate SHA256
        run: shasum -a 256 "Cocoa-Way-${GITHUB_REF_NAME}-arm64-macos.zip" "Cocoa-Way-${GITHUB_REF_NAME}-arm64-macos.dmg" > SHA256SUMS

      - name: Upload Draft Release Assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            Cocoa-Way-${{ github.ref_name }}-arm64-macos.zip
            Cocoa-Way-${{ github.ref_name }}-arm64-macos.dmg
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
